[package]
name = "rust_embarques"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-stm32 = { version = "0.5.0", features = [
    "defmt", "unstable-pac", "stm32l476rg", "memory-x",
    "time-driver-any", "exti", "chrono", "dual-bank",
] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = [
    "arch-cortex-m", "executor-thread", "defmt",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt", "defmt-timestamp-uptime", "tick-hz-32_768",
] }
defmt = "1.0.1"
defmt-rtt = "1.1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = { version = "0.9.2", default-features = false }
ssd1306 = { version = "0.10", default-features = false, features = ["graphics"] }
embedded-graphics = { version = "0.8", default-features = false }

[lints.clippy]
arithmetic_side_effects = "deny"


[[bin]]
name = "bargraph_example"
path = "src/bargraph_example.rs"

[[bin]]
name = "gamepad_example"
path = "src/gamepad_example.rs"

[[bin]]
name = "encoder_example"
path = "src/encoder_example.rs"

[[bin]]
name = "stepper_example"
path = "src/stepper_example.rs"

[[bin]]
name = "stepper_encoder"
path = "src/stepper_encoder.rs"

[[bin]]
name = "display_example"
path = "src/display_example.rs"